# DKMS config for AIOS out-of-tree modules (AlmaLinux 9 / RHEL 9).
# Source tree root for this package is kernel/ (this directory).
#
#   cd kernel && sudo make dkms-install
#   # or manually:
#   sudo dkms add .
#   sudo dkms install aios-kernel/0.4.0 -k $(uname -r)
#
# Secure Boot: modules must still be signed (mokutil / pesign) or SB disabled
# before insmod/modprobe will accept them.

PACKAGE_NAME="aios-kernel"
PACKAGE_VERSION="0.4.0"
AUTOINSTALL="yes"

MAKE[0]="make KDIR=${kernel_source_dir} dkms_build"
CLEAN[0]="make clean"

BUILT_MODULE_NAME[0]="aios_http"
BUILT_MODULE_LOCATION[0]="aios_http/"
DEST_MODULE_LOCATION[0]="/extra"

BUILT_MODULE_NAME[1]="aiosfs"
BUILT_MODULE_LOCATION[1]="aiosfs/"
DEST_MODULE_LOCATION[1]="/extra"

BUILT_MODULE_NAME[2]="aiosvd"
BUILT_MODULE_LOCATION[2]="aiosvd/"
DEST_MODULE_LOCATION[2]="/extra"
